[package]
name = "pybaldes"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Python bindings for BALDES 2.0 RCSP solver"

[lib]
name = "_core"
crate-type = ["cdylib"]

[features]
default = ["clp", "ryan-foster-master", "accumulated-resource-master", "ipm-blocked"]
ipm-blocked = ["baldes/ipm-blocked"]
clp = ["baldes/clp"]
highs = ["baldes/highs"]
gurobi = ["baldes/gurobi"]
simd = ["baldes/simd"]
multi-time-windows = ["baldes/multi-time-windows"]
rank-one-node-memory = ["baldes/rank-one-node-memory"]
ng-memory-31 = ["baldes/ng-memory-31"]
ng-memory-63 = ["baldes/ng-memory-63"]
ryan-foster-master = ["baldes/ryan-foster-master"]
accumulated-resource-master = ["baldes/accumulated-resource-master"]

[dependencies]
baldes = { path = "../..", default-features = false }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py39"] }
