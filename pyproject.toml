[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "pybaldes"
dynamic = ["version"]
description = "Rust-backed resource-constrained pricing and vehicle routing with branch-cut-and-price"
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "vendor/Clp/LICENSE", "vendor/CoinUtils/LICENSE"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
manifest-path = "python/rust/Cargo.toml"
python-source = "python"
module-name = "pybaldes._core"
features = ["multi-time-windows"]
include = [
    { path = "vendor/Clp/Clp/src/**/*", format = "sdist" },
    { path = "vendor/CoinUtils/CoinUtils/src/**/*", format = "sdist" },
    { path = "vendor/coin/**/*", format = "sdist" },
    { path = "vendor/Clp/LICENSE", format = "sdist" },
    { path = "vendor/CoinUtils/LICENSE", format = "sdist" },
]

[project.optional-dependencies]
test = ["pytest>=7"]
