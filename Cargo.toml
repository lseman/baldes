[workspace]
members = ["python/rust"]
resolver = "2"

[package]
name = "baldes"
version = "2.0.2"
edition = "2021"
rust-version = "1.70"
description = "BALDES 2.0: bucket-graph labeling RCSP solver and branch-cut-and-price root, written in Rust"
license = "MIT"
repository = "https://github.com/lseman/baldes"
documentation = "https://docs.rs/baldes"
categories = ["algorithms", "science::robotics"]
keywords = ["vehicle-routing", "rcsp", "branch-cut-and-price", "optimization", "solver"]
readme = "README.md"
autobins=false
# Integration suites are grouped under tests/ and registered below.
autotests=false
exclude = [
    "landing/", "pyproject.toml", ".github/",
    # Upstream Clp/CoinUtils extras; build.rs needs only */src, config.h and the licenses.
    "vendor/*/*/examples/", "vendor/*/*/MSVisualStudio/", "vendor/*/*/test/", "vendor/*/doxydoc/",
    "vendor/*/*/doxydoc/",
]

[lib]
name = "baldes"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = []
# Exact small-p enumeration on NVIDIA CUDA (requires nvcc).
cuda = ["dep:cc"]
# Runtime-dispatched AVX2 dominance scans and rank-one bitsets; portable fallback.
simd = []
# Disjoint service-start windows on disposable scalar resources.
multi-time-windows = []
# Enforce Ryan–Foster branches only through master rows; pricing ignores
# them. Without it, pricing also enforces them with binary resources.
ryan-foster-master = []
# Eight-label AVX-512F scans (Rust >= 1.89); AVX2/scalar fallback at runtime.
simd-avx512 = ["simd"]
# Clp restricted master and column-generation loop. Builds Clp 1.17.10 and
# CoinUtils 2.11 from the vendor/ submodules.
clp = ["dep:cc", "dep:serde", "dep:serde_json"]
# HiGHS LP backend and integer solving (including optional Clp-tree node MIP).
# Links against the system
# HiGHS shared library (libhighs.so) or a vendored copy placed in vendor/highs/.
highs = ["dep:pkg-config"]
# Licensed Gurobi C library, located through GUROBI_HOME.
gurobi = []

[dependencies]
# Keep the CPU pool compatible with Rust 1.70.
rayon = "=1.10.0"
rayon-core = "=1.12.1"
serde = { version = "=1.0.204", features = ["derive"], optional = true }
# Preserve the crate MSRV for the optional JSON front end.
serde_json = { version = "=1.0.122", features = ["float_roundtrip"], optional = true }

[build-dependencies]
cc = { version = "1", features = ["parallel"], optional = true }
pkg-config = { version = "0.3", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
debug = false
panic = "unwind"

[profile.dev]
opt-level = 1
panic = "unwind"

[[bin]]
name = "baldes"
path = "src/bin/baldes/main.rs"
required-features = ["clp"]

[[example]]
name = "import_pricing_bench"
path = "examples/import_pricing_bench.rs"
required-features = ["clp"]

