[workspace]
members = ["python/rust"]
resolver = "2"

[package]
name = "baldes"
version = "2.0.0"
edition = "2021"
rust-version = "1.70"
description = "BALDES 2.0: bucket-graph labeling RCSP solver and branch-cut-and-price root, written in Rust"
license = "MIT"
repository = "https://github.com/lseman/baldes"
documentation = "https://docs.rs/baldes"
categories = ["algorithms", "science::robotics"]
keywords = ["vehicle-routing", "rcsp", "branch-cut-and-price", "optimization", "solver"]
readme = "README.md"
autobins=false
# Integration suites are grouped under tests/ and registered below.
autotests=false
exclude = [
    "landing/", "pyproject.toml", ".github/",
    # Upstream Clp/CoinUtils extras; build.rs needs only */src, config.h and the licenses.
    "vendor/*/*/examples/", "vendor/*/*/MSVisualStudio/", "vendor/*/*/test/", "vendor/*/doxydoc/",
    "vendor/*/*/doxydoc/",
]

[lib]
name = "baldes"
path = "src/lib.rs"
# cdylib/staticlib expose the ported no-cut C API entry points.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
# Runtime-dispatched AVX2 dominance scans; portable fallback on other CPUs.
simd = []
# Clp restricted master and column-generation loop. Builds Clp 1.17.10 and
# CoinUtils 2.11 from the vendor/ submodules.
clp = ["dep:cc"]
# HiGHS LP backend and integer solving (including optional Clp-tree node MIP).
# Links against the system
# HiGHS shared library (libhighs.so) or a vendored copy placed in vendor/highs/.
highs = ["dep:pkg-config"]

[dependencies]

[build-dependencies]
cc = { version = "1", features = ["parallel"], optional = true }
pkg-config = { version = "0.3", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
debug = false
panic = "unwind"

[profile.dev]
opt-level = 1
panic = "unwind"

[[bin]]
name = "baldes"
path = "src/bin/baldes.rs"
required-features = ["clp"]

# API integration tests.

[[test]]
name = "c_api"
path = "tests/api/c_api.rs"

[[test]]
name = "cli"
path = "tests/api/cli.rs"

[[test]]
name = "options"
path = "tests/api/options.rs"

# Pricing integration tests.

[[test]]
name = "main_pricing"
path = "tests/pricing/main_pricing.rs"

[[test]]
name = "fixing_enumeration"
path = "tests/pricing/fixing_enumeration.rs"

[[test]]
name = "heuristic_scheduler"
path = "tests/pricing/heuristic_scheduler.rs"

# Cuts integration tests.

[[test]]
name = "capacity_root"
path = "tests/cuts/capacity_root.rs"

[[test]]
name = "kpath_knapsack"
path = "tests/cuts/kpath_knapsack.rs"

# Master integration tests.

[[test]]
name = "branching"
path = "tests/master/branching.rs"

[[test]]
name = "branch_price"
path = "tests/master/branch_price.rs"

[[test]]
name = "column_cleanup"
path = "tests/master/column_cleanup.rs"

[[test]]
name = "highs_mip"
path = "tests/master/highs_mip.rs"

[[test]]
name = "node_lifecycle"
path = "tests/master/node_lifecycle.rs"

[[test]]
name = "phase_bound"
path = "tests/master/phase_bound.rs"

[[test]]
name = "preprocessing"
path = "tests/master/preprocessing.rs"

# HGS integration tests.

[[test]]
name = "hgs_driver"
path = "tests/hgs/hgs_driver.rs"

[[test]]
name = "hgs_e2e"
path = "tests/hgs/hgs_e2e.rs"

# Instances integration tests.

[[test]]
name = "cvrplib"
path = "tests/instances/cvrplib.rs"

# Independent pricing regression tests.

[[test]]
name = "porting_regressions"
path = "tests/pricing/porting_regressions.rs"

[[test]]
name = "partial_solution"
path = "tests/master/partial_solution.rs"

[[test]]
name = "ipm"
path = "tests/ipm/solver.rs"

[[test]]
name = "networks"
path = "tests/master/networks.rs"
required-features = ["clp"]
