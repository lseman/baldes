name: Landing Page

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'docs/**'
      - '.github/scripts/compile_docs.py'
      - '.github/scripts/test_compile_docs.py'
      - '.github/scripts/docs-requirements.txt'
      - '.github/workflows/landing.yaml'
  workflow_dispatch:

concurrency:
  group: github-pages-deployment
  cancel-in-progress: false

env:
  SITE_DOMAIN: baldes.laioseman.com

jobs:
  deploy:
    name: Build documentation and deploy website
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/scripts/docs-requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r .github/scripts/docs-requirements.txt
      - name: Test documentation compiler
        run: python -m unittest discover -s .github/scripts -p 'test_compile_docs.py'
      - name: Compile Markdown guides
        run: python .github/scripts/compile_docs.py --base-url "https://${SITE_DOMAIN}/"
      - name: GH Pages Deployment
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./landing
          keep_files: false
          enable_jekyll: false
          allow_empty_commit: false
          publish_branch: gh-pages
          cname: ${{ env.SITE_DOMAIN }}
